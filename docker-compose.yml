services:
  frontend:
    restart: unless-stopped
    build: ./front
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      # Enable Traefik
      - "traefik.enable=true"

      # HTTPS router
      - "traefik.http.routers.santoriello-frontend.rule=Host(`santoriello.ch`)"
      - "traefik.http.routers.santoriello-frontend.entrypoints=websecure"
      - "traefik.http.routers.santoriello-frontend.tls.certresolver=le"

      # The container listens on 8080, not 80: nginx runs unprivileged and
      # cannot bind a port below 1024. Without this label Traefik would have
      # to infer the port and the site would 502.
      - "traefik.http.services.santoriello-frontend.loadbalancer.server.port=8080"

      # security-headers and gzip-compress live in Traefik's file provider
      # (dynamic/middlewares.yml); the @file suffix selects that provider.
      - "traefik.http.routers.santoriello-frontend.middlewares=security-headers@file,gzip-compress@file"

      # www.santoriello.ch -> santoriello.ch
      #
      # DNS for www already points at this VPS, but no router matched the name,
      # so Traefik answered with its own default certificate and browsers
      # refused the connection with ERR_CERT_AUTHORITY_INVALID. With -k it was
      # a plain 404, which is the tell: an unrouted host, not a broken cert.
      #
      # A router is required for Let's Encrypt to issue a certificate for the
      # name at all - a redirect alone cannot help, because the TLS handshake
      # happens before any redirect is applied.
      - "traefik.http.routers.santoriello-www.rule=Host(`www.santoriello.ch`)"
      - "traefik.http.routers.santoriello-www.entrypoints=websecure"
      - "traefik.http.routers.santoriello-www.tls.certresolver=le"
      - "traefik.http.routers.santoriello-www.service=santoriello-frontend"
      - "traefik.http.routers.santoriello-www.middlewares=santoriello-www-redirect"

      # $${1}, not ${1}: Docker Compose interpolates $ inside label values, so a
      # single $ would be eaten before Traefik ever saw the capture group.
      - "traefik.http.middlewares.santoriello-www-redirect.redirectregex.regex=^https://www\\.santoriello\\.ch/(.*)"
      - "traefik.http.middlewares.santoriello-www-redirect.redirectregex.replacement=https://santoriello.ch/$${1}"
      - "traefik.http.middlewares.santoriello-www-redirect.redirectregex.permanent=true"
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
